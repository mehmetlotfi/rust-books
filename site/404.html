(function(){var d=['site','book','rbe','rustlings','edition-guide','cargo','rustc','rustdoc','clippy','errors','reference','style-guide','nomicon','unstable','rustc-dev-guide','embedded','cli','assets','licenses'];
var p=location.pathname.split('/').filter(Boolean),root='/';
for(var i=0;i<p.length;i++){if(d.indexOf(p[i])>-1){root='/'+p.slice(0,i).join('/')+(i?'/':'');break}}
if(root==='/'&&p.length&&/\.github\.io$/.test(location.hostname)&&p[0].indexOf('.')<0&&d.indexOf(p[0])<0&&!/\.html$/.test(p[0]))root='/'+p[0]+'/';
document.write('<base href="'+root+'">');
try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
